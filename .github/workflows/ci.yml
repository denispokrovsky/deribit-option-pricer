name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-test-bench:
    name: ${{ matrix.compiler }} / build, test, benchmark
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DDP_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Benchmark
        run: ./build/bench/dp_bench --benchmark_min_time=0.2s --benchmark_counters_tabular=true

      - name: Run CLI on the Deribit sample
        run: |
          ./build/apps/dp_cli < data/btc_options_sample.csv > result.csv
          head -n 5 result.csv

      - name: Load results into SQLite and run SQL reports
        run: |
          command -v sqlite3 || (sudo apt-get update && sudo apt-get install -y sqlite3)
          python3 scripts/load_results.py --db results.db --snapshot sample < result.csv
          sqlite3 results.db < sql/reports.sql

  docker:
    name: Docker image (clean environment)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t deribit-pricer .
      - name: Run image on the Deribit sample
        run: |
          docker run --rm -i deribit-pricer < data/btc_options_sample.csv > result.csv
          head -n 5 result.csv
